<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Review your annual music plan before continuing to payment."
    />
    <title>Order Summary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="main">
      <div class="page-content">
        <section class="container" aria-labelledby="order-heading">
          <img
            class="hero-image"
            src="./assets/music-illustration.svg"
            alt="A woman enjoying music with headphones"
          />

          <div class="order-content">
            <h1 class="heading" id="order-heading">Order Summary</h1>
            <p class="summary-para">
              You can now listen to millions of songs, audiobooks, and podcasts
              on any device anywhere you like!
            </p>

            <div class="plan-details">
              <span class="music-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M9 18V5l12-2v13M9 18c0 1.1-1.6 2-3.5 2S2 19.1 2 18s1.6-2 3.5-2S9 16.9 9 18Zm12-2c0 1.1-1.6 2-3.5 2S14 17.1 14 16s1.6-2 3.5-2 3.5.9 3.5 2ZM9 9l12-2"
                  />
                </svg>
              </span>
              <div class="plan-text">
                <h2>Annual Plan</h2>
                <p>$59.99/year</p>
              </div>
              <a class="change-link" href="#plan">Change</a>
            </div>

            <button class="proceed-btn" type="button">Proceed to Payment</button>
            <a class="cancel-order" href="#cancel">Cancel Order</a>
          </div>
        </section>

        <footer class="attribution">
          Challenge by
          <a href="https://www.crio.do/" target="_blank" rel="noreferrer">Crio.do</a>.
          Coded by
          <a href="https://github.com/" target="_blank" rel="noreferrer">Apoorva</a>.
        </footer>
      </div>
    </main>
  </body>
</html>
